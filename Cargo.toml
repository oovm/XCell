[workspace]
resolver = "3"
members = [
    "backends/*",
    "frontends/xcell-desktop",
]
default-members = [
    "backends/*",
]
exclude = [
    "projects/.DS_Store",
]


[workspace.package]
edition = "2024"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
byteorder = "1.5.0"
concat-idents = "1.1.5"
time = "0.3.47"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time", "env-filter"] }
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.51.1", features = ["full"] }
calamine = "0.34.0"
convert_case = "0.11.0"
pathdiff = "0.2.3"
regex = "1.12.3"
twox-hash = "2.1.2"
serde = { version = "1.0.228", features = ["derive"] }
integer-encoding = "4.1.0"
diagnostic = "0.6.4"
validatus = "0.0.6"
futures = "0.3.32"
async-walkdir = "2.1.0"
notify = { version = "8.2.0", features = ["serde"] }
walkdir = "2.5.0"
globset = { version = "0.4.18", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
num = { version = "0.4.3", features = ["serde"] }
bigdecimal = { version = "0.4.10", features = ["serde"] }
array2d = { version = "0.3.2", features = ["serde"] }
csscolorparser = { version = "0.8.3", features = ["serde"] }
itertools = "0.14.0"
vlq-rust = "0.4.0"
winres = "0.1.12"
peginator = "0.7.0"
csv = "1.4.0"

log = { version = "0.4.29", features = ["std"] }
proc-macro2 = "1.0.106"
syn = "2.0.117"
quote = "1.0.45"
once_cell = "1.21.4"
tempfile = "3.27.0"
wit-bindgen-rt = "0.44.0"

xcell = { path = "backends/xcell", version = "0.2.0" }
xcell-core = { path = "backends/xcell-core", version = "0.2.0" }
xcell-analyzer = { path = "backends/xcell-analyzer", version = "0.2.0" }
xcell-provider = { path = "backends/xcell-provider", version = "0.2.0" }
xcell-generator = { path = "backends/xcell-generator", version = "0.2.0" }
xcell-plugin = { path = "backends/xcell-plugin", version = "0.2.0" }
xcell-config = { path = "backends/xcell-config", version = "0.2.0" }
xcell-parser = { path = "backends/xcell-parser", version = "0.2.0" }

# oak parsers
oak-csv = { path = "../oaks/examples/oak-csv" }
oak-json = { path = "../oaks/examples/oak-json" }
oak-toml = { path = "../oaks/examples/oak-toml", features = ["serde"] }
oak-dejavu = { path = "../oaks/examples/oak-dejavu" }

# nargo template engine
nargo-template = { path = "../nargo/compilers/nargo-template" }
nargo-types = { path = "../nargo/compilers/nargo-types" }

[profile.release]
lto = true
strip = true
panic = "abort"
