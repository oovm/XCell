[package]
name = "xcell-errors"
version = "0.1.3"
authors = ["Aster <192607617@qq.com>"]
description = "Error handlers for xcell"
repository = "https://github.com/oovm/XCell"
documentation = "https://docs.rs/xcell-errors"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"

[dependencies]
serde = "1.0.192"
diagnostic = "0.5.6"
validatus = "0.0.4"
futures = "0.3.29"
calamine = { version = "0.22.1", optional = true, features = ["dates"] }
tera = { version = "1.19.1", optional = true }
askama = { version = "0.12.1", optional = true }
toml = { version = "0.8.8", optional = true }
serde_json = { version = "1.0.108", optional = true }
async-walkdir = { version = "0.2.0", optional = true }
notify = { version = "6.1.1", optional = true, features = ["serde"] }
walkdir = { version = "2.4.0", optional = true }
globset = { version = "0.4.13", optional = true, features = ["serde"] }
url = { version = "2.4.1", optional = true, features = ["serde"] }
num = { version = "0.4.1", optional = true, features = ["serde"] }
bigdecimal = { version = "0.4.2", optional = true, features = ["serde"] }
#decimal = { version = "2.1.0", features = ["serde"] }
array2d = { version = "0.3.0", optional = true, features = ["serde"] }
#ndarray = { version = "0.15.6", features = ["serde"] }
chrono = { version = "0.4.31", optional = true, features = ["serde"] }
csscolorparser = { version = "0.6.2", optional = true, features = ["serde"] }


[dev-dependencies]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
