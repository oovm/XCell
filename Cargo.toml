[workspace]
resolver = "2"
members = [
    "backends/*",
    "frontends/xcell-desktop",
]
default-members = [
    "backends/*",
]
exclude = [
    "projects/.DS_Store",
]


[workspace.package]
edition = "2024"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
byteorder = "1.5.0"
concat-idents = "1.1.5"
time = "0.3.34"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["local-time", "env-filter"] }
chrono = "0.4.34"
clap = { version = "4.5.1", features = ["derive"] }
tokio = { version = "1.36.0", features = ["full"] }
calamine = "0.24.0"
convert_case = "0.6.0"
toml = "0.8.10"
serde_json = "1.0.114"
pathdiff = "0.2.1"
regex = "1.10.3"
twox-hash = "1.6.3"
serde = { version = "1.0.197", features = ["derive"] }
integer-encoding = "4.0.0"
diagnostic = "0.6.1"
validatus = "0.0.6"
futures = "0.3.30"
tera = "1.19.1"
async-walkdir = "1.0.0"
notify = { version = "6.1.1", features = ["serde"] }
walkdir = "2.4.0"
globset = { version = "0.4.14", features = ["serde"] }
url = { version = "2.5.0", features = ["serde"] }
num = { version = "0.4.1", features = ["serde"] }
bigdecimal = { version = "0.4.2", features = ["serde"] }
array2d = { version = "0.3.2", features = ["serde"] }
csscolorparser = { version = "0.6.2", features = ["serde"] }
itertools = "0.12.1"
vlq-rust = "0.4.0"
winres = "0.1.12"
peginator = "0.7.0"
csv = "1.3.0"
iced = "0.12.1"
log = { version = "0.4.20", features = ["std"] }
proc-macro2 = "1.0"
syn = "2.0"
quote = "1.0"
thiserror = "1.0"
wit-bindgen-rt = "0.16.0"
once_cell = "1.19.0"

dejavu-types = { path = "../dejavu-engine/backends/dejavu-types" }
dejavu-macros = { path = "../dejavu-engine/backends/dejavu-macros" }
dejavu-engine = { path = "../dejavu-engine/backends/dejavu-engine" }

oak-json = { path = "../oaks/examples/oak-json" }

xcell-types = { path = "backends/xcell-types", version = "0.2.0" }
xcell-analyzer = { path = "backends/xcell-analyzer", version = "0.2.0" }
xcell-provider = { path = "backends/xcell-provider", version = "0.2.0" }
xcell = { path = "backends/xcell", version = "0.2.0" }
xcell-generator = { path = "backends/xcell-generator", version = "0.2.0" }
xcell-plugin = { path = "backends/xcell-plugin", version = "0.2.0" }
xcell-config = { path = "backends/xcell-config", version = "0.2.0" }
xcell-parser = { path = "backends/xcell-parser", version = "0.2.0" }


tempfile = "3.10.1"

[profile.release]
lto = true
strip = true
panic = "abort"
