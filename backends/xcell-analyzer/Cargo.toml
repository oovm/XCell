[package]
name = "xcell-analyzer"
version = { workspace = true }
authors = { workspace = true }
description = "XCell analyzer library"
repository = "https://github.com/oovm/XCell"
documentation = "https://docs.rs/xcell-analyzer"
license = { workspace = true }
edition = { workspace = true }


[dependencies]
tracing = { workspace = true }
calamine = { workspace = true }
convert_case = { workspace = true }
oak-toml = { workspace = true, features = ["serde"] }
oak-json = { workspace = true }
pathdiff = { workspace = true }
regex = { workspace = true }
twox-hash = { workspace = true }
serde = { workspace = true }
csv = { workspace = true }
tokio = { workspace = true }
integer-encoding = { workspace = true }
globset = { workspace = true, features = ["serde"] }
notify = { workspace = true, features = ["serde"] }
walkdir = { workspace = true }
async-walkdir = { workspace = true }



[dependencies.xcell-core]
workspace = true
features = ["num", "bigdecimal", "chrono", "csscolorparser", "oak-json"]

[dependencies.xcell-provider]
workspace = true

[dependencies.xcell-plugin]
workspace = true

[dependencies.xcell-config]
workspace = true

[dependencies.xcell-parser]
workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true }

[build-dependencies]
peginator = { workspace = true }

[features]
default = []
