[package]
name = "xcell-core"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
description = "XCell core library"
repository = "https://github.com/oovm/XCell"
documentation = "https://docs.rs/xcell-core"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2021"


[dependencies]
tracing = "0.1.37"
calamine = "0.19.1"
convert_case = "0.6.0"
toml = "0.7.3"
serde_json = "1.0.96"
pathdiff = "0.2.1"
askama = "0.12.0"
regex = "1.8.1"
twox-hash = "1.6.3"
serde = { version = "1.0.163", features = ["derive"] }
itertools = "0.10.5"
#futures = "0.3.17"
tokio = { version = "1.28.1", features = ["full"] }
integer-encoding = "3.0.4"

[dependencies.xcell-errors]
#version = "0.1.2"
path = "../xcell-errors"
features = ["toml", "globset", "async-walkdir", "notify", "num", "url", "askama"]

[dependencies.xcell-types]
version = "0.2.1"
path = "../xcell-types"
features = ["csharp"]

[dev-dependencies]
tracing-subscriber = "0.3.17"

[build-dependencies]
peginator = "0.6.0"

[features]
default = []
